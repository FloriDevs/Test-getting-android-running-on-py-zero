name: Build Android 2.3 for Pi Zero

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository klonen
      uses: actions/checkout@v4

    - name: Abhängigkeiten installieren
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev libc6-dev lib32ncurses-dev \
          x11proto-core-dev libx11-dev libreadline-dev libgl1-mesa-dev \
          tofrodos python3-markdown libxml2-utils xsltproc python-is-python3

    - name: Java 6 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '6'

    - name: Repo-Tool installieren und Quellcode clonen
      run: |
        # 1. Google Repo-Tool herunterladen
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=$PATH:~/bin

        # 2. Ordner für die Android-Quelltexte anlegen
        mkdir -p android-source
        cd android-source

        # 3. Git-Konfiguration für das Repo-Tool
        git config --global user.email "runner@github.com"
        git config --global user.name "GitHub Action Runner"

        # 4. Offizielles AOSP-Manifest für Gingerbread initialisieren und synchronisieren
        repo init -u https://android.googlesource.com/platform/manifest -b android-2.3.7_r1
        repo sync -j$(nproc)

    - name: Build starten
      run: |
        cd android-source
        source build/envsetup.sh
        lunch rpi-eng
        make -j$(nproc)

    - name: Fertige Images als Artifact hochladen
      uses: actions/upload-artifact@v4
      with:
        name: android-2.3-rpi-zero-images
        path: |
          android-source/out/target/product/rpi/*.img
